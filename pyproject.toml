[project]
name = "gpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rasalghulsslayer", email = "akadosthomas@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "datetime>=6.0",
    "regex>=2026.9.29",
    "torch>=2.15.0",
]

[project.scripts]
gpt = "gpt:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
